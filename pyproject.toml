[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-tree"
version = "0.0.0"
description = "A platform-agnostic health tree for nodes, checks, and dependency inhibition"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Michael Cumming", email = "mjcumming@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/mjcumming/health-tree"
Repository = "https://github.com/mjcumming/health-tree"
Documentation = "https://github.com/mjcumming/health-tree/blob/main/docs/rfp.md"

[tool.hatch.build.targets.wheel]
packages = ["src/health_tree"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

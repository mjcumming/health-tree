[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "health-tree"
version = "0.0.0"
description = "Platform-agnostic health across a dependency graph: checks, dependency-aware episodes, and an attention policy"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Michael Cumming", email = "mjcumming@users.noreply.github.com" },
]
keywords = ["alerting", "dependencies", "health", "home-assistant", "monitoring", "root-cause"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mjcumming/health-tree"
Repository = "https://github.com/mjcumming/health-tree"
Issues = "https://github.com/mjcumming/health-tree/issues"
Changelog = "https://github.com/mjcumming/health-tree/blob/main/CHANGELOG.md"
Documentation = "https://github.com/mjcumming/health-tree/blob/main/docs/rfp.md"

[dependency-groups]
dev = [
  "hypothesis>=6.168",
  "mypy>=2.3.1",
  "prek>=0.5.3",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "pyyaml>=6.0.3",
  "ruff>=0.16.8",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/health_tree"]

[tool.ruff]
required-version = ">=0.16.8"
src = ["src", "tests"]

[tool.ruff.lint]
# Home Assistant core's selection, without the asyncio rules (ADR 0014).
select = [
  "A001",   # Variable {name} is shadowing a Python builtin
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C",      # complexity
  "COM818", # Trailing comma on bare tuple prohibited
  "D",      # docstrings
  "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
  "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
  "DTZ011", # Use datetime.now(tz=).date() instead of date.today()
  "E",      # pycodestyle
  "F",      # pyflakes/autoflake
  "F541",   # f-string without any placeholders
  "FLY",    # flynt
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "INP",    # flake8-no-pep420
  "ISC",    # flake8-implicit-str-concat
  "ICN001", # import conventions; {name} should be imported as {asname}
  "ICN002", # import conventions; {name} should not be imported as {asname}
  "LOG",    # flake8-logging
  "N804",   # First argument of a class method should be named cls
  "N805",   # First argument of a method should be named self
  "N806",   # Variable {name} in function should be snake_case
  "N815",   # Variable {name} in class scope should not be mixedCase
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-pathlib
  "PYI",    # flake8-pyi
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "S102",   # Use of exec detected
  "S103",   # bad-file-permissions
  "S108",   # hardcoded-temp-file
  "S301",   # suspicious-pickle-usage
  "S307",   # suspicious-eval-usage
  "S602",   # subprocess-popen-with-shell-equals-true
  "S604",   # call-with-shell-equals-true
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T100",   # Trace found: {name} used
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TID",    # Tidy imports
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "W",      # pycodestyle
]
ignore = [
  "D202",    # No blank lines allowed after function docstring
  "D203",    # 1 blank line required before class docstring
  "D213",    # Multi-line docstring summary should start at the second line
  "D406",    # Section name should end with a newline
  "D407",    # Section name underlining
  "D417",    # Missing argument descriptions; document only non-obvious parameters
  "E501",    # line too long; the formatter owns line length
  "PLC1901", # Empty-string comparisons; too many false positives
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments
  "PLR0915", # Too many statements
  "PLR0917", # Too many positional arguments
  "PLR2004", # Magic value used in comparison
  "PLW0108", # Unnecessary lambda
  "PLW1641", # __eq__ without __hash__
  "PLW2901", # Loop variable overwritten
  "PT011",   # pytest.raises() too broad
  "PT018",   # Composite assertion
  "RUF001",  # Ambiguous unicode character in string
  "RUF012",  # Mutable class attributes should be annotated with ClassVar
  "RUF015",  # Prefer next(...) over single element slice
  "RUF043",  # Unescaped metacharacters in pytest.raises(match=)
  "SIM102",  # Nested if statements
  "SIM103",  # Return the condition directly
  "SIM108",  # Ternary operator
  "SIM115",  # Context handler for opening files
  "TC001",   # Moving imports into type-checking blocks can break patching in tests
  "TC002",
  "TC003",
  "TC006",   # Quotes in typing.cast()
  "TRY003",  # Long messages outside the exception class
  "TRY400",  # logging.exception instead of logging.error
  "UP047",   # Non PEP 696 generic function
  "UP049",   # Private type parameter names
  # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191",
  "E111",
  "E114",
  "E117",
  "D206",
  "D300",
  "Q",
  "COM812",
  "COM819",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Not needed: health-tree requires Python 3.14 (PEP 649)."
"asyncio".msg = "The library has no event loop (ADR 0003)."
"datetime.date.today".msg = "Take `now` as an argument (ADR 0003)."
"datetime.datetime.now".msg = "Take `now` as an argument (ADR 0003)."
"datetime.datetime.utcnow".msg = "Take `now` as an argument (ADR 0003)."
"homeassistant".msg = "The library never imports Home Assistant (ADR 0002)."
"pytz".msg = "Use zoneinfo."
"threading".msg = "The library starts no threads (ADR 0003)."
"time.monotonic".msg = "Take `now` as an argument (ADR 0003)."
"time.sleep".msg = "Never sleep; return a deadline instead (ADR 0003)."
"time.time".msg = "Take `now` as an argument (ADR 0003)."
"uuid.uuid1".msg = "Reads the clock. Build ids from `now` (ADR 0017)."
"uuid.uuid6".msg = "Reads the clock. Build ids from `now` (ADR 0017)."
"uuid.uuid7".msg = "Reads the clock. Build ids from `now` (ADR 0017)."

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["health_tree"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
# Home Assistant core's additions to strict mode (ADR 0014).
show_error_codes = true
local_partial_types = true
strict_bytes = true
warn_incomplete_stub = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "explicit-override",
  "ignore-without-code",
  "redundant-self",
  "truthy-iterable",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["health_tree"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "raise AssertionError",
]

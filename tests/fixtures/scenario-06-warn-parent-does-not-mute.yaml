id: scenario-06-warn-parent-does-not-mute
title: A parent that only warns mutes nobody
covers: [scenario-6]
start: 2026-09-24T12:00:00Z
settings:
  settle: 2m
  rejoin_grace: 1m
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
graph:
  - id: parent
    checks:
      - {id: link, raise_hold: 0s, clear_hold: 30s, ttl: 1h, unknown_hold: 15m}
  - id: child
    depends_on: [parent]
    checks:
      - {id: state, raise_hold: 0s, clear_hold: 30s, ttl: 1h, unknown_hold: 15m}
steps:
  - at: 2026-09-24T12:00:00Z
    ingest:
      - {node: parent, check: link, status: warn, reason: degraded}
      - {node: child, check: state, status: pass, reason: ok}
    expect:
      bind:
        parent_ep: {opened: parent}
      events:
        - {opened: {anchor: parent, episode: $parent_ep, status: warn}}
  - at: 2026-09-24T12:01:00Z
    ingest:
      - {node: child, check: state, status: fail, reason: fault}
    expect:
      bind:
        child_ep: {opened: child}
      events:
        - {opened: {anchor: child, episode: $child_ep, status: fail}}
      open:
        - {episode: $parent_ep, anchor: parent}
        - {episode: $child_ep, anchor: child}

id: scenario-15-late-parent-absorbs-child
title: A parent confirmed after the child opened absorbs the child's episode
covers: [scenario-15]
start: 2026-09-24T17:00:00Z
settings:
  settle: 2m
  rejoin_grace: 1m
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
graph:
  - id: parent
    checks:
      - {id: link, raise_hold: 1m, clear_hold: 30s, ttl: 1h, unknown_hold: 15m}
  - id: child
    depends_on: [parent]
    checks:
      - {id: state, raise_hold: 0s, clear_hold: 30s, ttl: 1h, unknown_hold: 15m}
steps:
  - at: 2026-09-24T17:00:00Z
    ingest:
      - {node: child, check: state, status: pass, reason: ok}
    expect:
      events: []
  - at: 2026-09-24T17:01:00Z
    ingest:
      - {node: child, check: state, status: fail, reason: unreachable}
    expect:
      events:
        - {probe: parent}
  - at: 2026-09-24T17:02:30Z
    ingest:
      - {node: parent, check: link, status: fail, reason: unreachable}
    expect:
      events: []
  - at: 2026-09-24T17:03:00Z
    expect:
      bind:
        child_ep: {opened: child}
      events:
        - {opened: {anchor: child, episode: $child_ep}}
  - at: 2026-09-24T17:03:30Z
    expect:
      bind:
        parent_ep: {opened: parent}
      events:
        - {opened: {anchor: parent, episode: $parent_ep, recorded: [child], absorbed: [$child_ep]}}
        - {resolved: {episode: $child_ep, resolution: absorbed}}
      open:
        - {episode: $parent_ep, anchor: parent}

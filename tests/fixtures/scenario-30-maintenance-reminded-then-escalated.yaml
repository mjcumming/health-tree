id: scenario-30-maintenance-reminded-then-escalated
title: Pending maintenance is reminded weekly and rises a level after 30 days
covers: [scenario-30]
start: 2026-09-01T07:00:00Z
settings:
  settle: 2m
  rejoin_grace: 1m
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
policy:
  batch: 30s
  recipients:
    michael:
      channels: [phone]
      quiet_hours: "22:30-07:00"
  digests:
    morning:
      at: "08:00"
      to: michael
  rules:
    - match: {category: operation, importance: [high, critical]}
      loudness: urgent
      to: michael
    - match: {status: warn, due_within: 24h}
      loudness: notify
      to: michael
    - match: {category: maintenance}
      loudness: digest
      digest: morning
      remind_every: 7d
      escalate_after: 30d
    - match: {status: [fail, unknown], importance: [high, critical]}
      loudness: urgent
      to: michael
    - match: {status: fail}
      loudness: notify
      to: michael
    - match: {}
      loudness: digest
      digest: morning
graph:
  - id: ai_updates
    kind: maintenance
    checks:
      - {id: update, raise_hold: 0s, clear_hold: 30s, ttl: null, unknown_hold: 1d, labels: {category: maintenance}}
steps:
  - at: 2026-09-01T07:00:00Z
    ingest:
      - {node: ai_updates, check: update, status: warn, reason: update_pending}
    expect:
      bind:
        updates_ep: {opened: ai_updates}
      events:
        - {opened: {anchor: ai_updates, episode: $updates_ep}}
      deliveries: []
  - at: 2026-09-01T08:00:00Z
    expect:
      events: []
      deliveries:
        - {loudness: digest, digest: morning, episode: $updates_ep, to: michael}
  - at: 2026-09-02T08:00:00Z
    expect:
      events: []
      deliveries: []
  - at: 2026-09-08T08:00:00Z
    expect:
      events: []
      deliveries:
        - {loudness: digest, digest: morning, episode: $updates_ep, to: michael}
  - at: 2026-09-15T08:00:00Z
    expect:
      events: []
      deliveries:
        - {loudness: digest, digest: morning, episode: $updates_ep, to: michael}
  - at: 2026-09-22T08:00:00Z
    expect:
      events: []
      deliveries:
        - {loudness: digest, digest: morning, episode: $updates_ep, to: michael}
  - at: 2026-09-29T08:00:00Z
    expect:
      events: []
      deliveries:
        - {loudness: digest, digest: morning, episode: $updates_ep, to: michael}
  - at: 2026-10-01T07:00:00Z
    expect:
      events: []
      deliveries: []
  - at: 2026-10-01T07:00:30Z
    expect:
      events: []
      deliveries:
        - {loudness: notify, episode: $updates_ep, to: michael}

id: scenario-45-group-dissolves-below-count
title: A group that falls below coalesce_count resolves, and the rest stand alone
covers: [scenario-45]
start: 2026-09-24T04:00:00Z
settings:
  settle: 2m
  rejoin_grace: 1m
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
graph:
  - id: controller
    checks:
      - id: link
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
  - id: d1
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
  - id: d2
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
  - id: d3
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
steps:
  - at: 2026-09-24T04:00:00Z
    ingest:
      - {node: controller, check: link, status: pass, reason: ok}
      - {node: d1, check: cmd, status: pass, reason: ok}
      - {node: d2, check: cmd, status: pass, reason: ok}
      - {node: d3, check: cmd, status: pass, reason: ok}
    expect:
      events: []
  - at: 2026-09-24T04:01:00Z
    ingest:
      - {node: d1, check: cmd, status: fail, reason: command_failed}
      - {node: d2, check: cmd, status: fail, reason: command_failed}
      - {node: d3, check: cmd, status: fail, reason: command_failed}
    expect:
      bind:
        group_ep: {opened: controller}
      events:
        - {opened: {anchor: controller, episode: $group_ep}}
  - at: 2026-09-24T04:02:00Z
    ingest:
      - {node: d1, check: cmd, status: pass, reason: ok}
    expect:
      events: []
  - at: 2026-09-24T04:02:31Z
    expect:
      events:
        - {resolved: {episode: $group_ep, resolution: cleared}}
      open: []
  - at: 2026-09-24T04:03:32Z
    expect:
      bind:
        d2_ep: {opened: d2}
        d3_ep: {opened: d3}
      events:
        - {opened: {anchor: d2, episode: $d2_ep, reasons: [command_failed]}}
        - {opened: {anchor: d3, episode: $d3_ep, reasons: [command_failed]}}
      open:
        - {episode: $d2_ep, anchor: d2}
        - {episode: $d3_ep, anchor: d3}

id: scenario-52-sibling-joins-open-group
title: A sibling that fails later joins the open group
covers: [scenario-52]
start: 2026-09-24T07:00:00Z
settings:
  settle: 2m
  rejoin_grace: 1m
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
graph:
  - id: controller
    checks:
      - id: link
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
  - id: d1
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
  - id: d2
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
  - id: d3
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
  - id: d4
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 10m
        unknown_hold: 15m
steps:
  - at: 2026-09-24T07:00:00Z
    ingest:
      - {node: controller, check: link, status: pass, reason: ok}
      - {node: d1, check: cmd, status: pass, reason: ok}
      - {node: d2, check: cmd, status: pass, reason: ok}
      - {node: d3, check: cmd, status: pass, reason: ok}
      - {node: d4, check: cmd, status: pass, reason: ok}
    expect:
      events: []
  - at: 2026-09-24T07:01:00Z
    ingest:
      - {node: d1, check: cmd, status: fail, reason: command_failed}
      - {node: d2, check: cmd, status: fail, reason: command_failed}
      - {node: d3, check: cmd, status: fail, reason: command_failed}
    expect:
      bind:
        group_ep: {opened: controller}
      events:
        - {opened: {anchor: controller, episode: $group_ep}}
  - at: 2026-09-24T07:03:00Z
    ingest:
      - {node: d4, check: cmd, status: fail, reason: command_failed}
    expect:
      events:
        - {updated: {episode: $group_ep}}
      open:
        - {episode: $group_ep, anchor: controller}

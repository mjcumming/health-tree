id: scenario-53-atomic-observation-batch
title: An atomic batch coalesces without intermediate child episodes in either order
covers: [scenario-53]
start: 2026-09-24T12:00:00Z
settings:
  settle: 2m
  rejoin_grace: 1m
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
graph:
  - id: controller
    checks:
      - id: link
        raise_hold: 0s
        clear_hold: 30s
        ttl: 1h
        unknown_hold: 15m
  - id: d1
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 1h
        unknown_hold: 15m
  - id: d2
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 1h
        unknown_hold: 15m
  - id: d3
    depends_on: [controller]
    checks:
      - id: cmd
        raise_hold: 0s
        clear_hold: 30s
        ttl: 1h
        unknown_hold: 15m
steps:
  - at: 2026-09-24T12:00:00Z
    ingest:
      - {node: controller, check: link, status: pass, reason: ok}
      - {node: d1, check: cmd, status: pass, reason: ok}
      - {node: d2, check: cmd, status: pass, reason: ok}
      - {node: d3, check: cmd, status: pass, reason: ok}
    expect:
      events: []
  - at: 2026-09-24T12:01:00Z
    ingest:
      - {node: d1, check: cmd, status: fail, reason: command_failed}
      - {node: d2, check: cmd, status: fail, reason: command_failed}
      - {node: d3, check: cmd, status: fail, reason: command_failed}
    expect:
      bind:
        first_group: {opened: controller}
      events:
        - {opened: {anchor: controller, episode: $first_group, form: group, status: fail, recorded: [d1, d2, d3], absorbed: []}}
      open:
        - {anchor: controller, episode: $first_group, recorded: [d1, d2, d3]}
  - at: 2026-09-24T12:02:00Z
    ingest:
      - {node: d1, check: cmd, status: pass, reason: ok}
      - {node: d2, check: cmd, status: pass, reason: ok}
      - {node: d3, check: cmd, status: pass, reason: ok}
    expect:
      events: []
  - at: 2026-09-24T12:02:31Z
    expect:
      events:
        - {resolved: {episode: $first_group, resolution: cleared}}
      open: []
  - at: 2026-09-24T12:04:00Z
    ingest:
      - {node: d3, check: cmd, status: fail, reason: command_failed}
      - {node: d2, check: cmd, status: fail, reason: command_failed}
      - {node: d1, check: cmd, status: fail, reason: command_failed}
    expect:
      bind:
        second_group: {opened: controller}
      events:
        - {opened: {anchor: controller, episode: $second_group, form: group, status: fail, recorded: [d1, d2, d3], absorbed: []}}
      open:
        - {anchor: controller, episode: $second_group, recorded: [d1, d2, d3]}

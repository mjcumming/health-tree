id: scenario-72-reminders-respect-quiet-hours
title: A reminder waits through quiet hours and survives restart
covers: [scenario-72]
start: 2026-09-25T20:00:00Z
settings: {settle: 0s, rejoin_grace: 0s, startup_grace: 0s, coalesce_count: 3, coalesce_window: 60s}
policy:
  batch: 0s
  digests: {}
  recipients:
    owner: {channels: [phone], quiet_hours: "22:00-07:00"}
  rules:
    - match: {}
      loudness: notify
      to: owner
      remind_every: 2h
graph:
  - id: device
    checks:
      - {id: available, raise_hold: 0s, clear_hold: 0s, ttl: null, unknown_hold: 15m}
steps:
  - at: 2026-09-25T20:00:00Z
    ingest:
      - {node: device, check: available, status: fail, reason: unavailable}
    expect:
      events: [{opened: {anchor: device, episode: $problem}}]
      bind: {problem: {opened: device}}
      deliveries:
        - {loudness: notify, episode: $problem, to: owner, silent: false}
  - at: 2026-09-25T22:00:00Z
    expect: {events: [], deliveries: []}
  - at: 2026-09-26T01:00:00Z
    restart: true
    expect: {events: [], deliveries: []}
  - at: 2026-09-26T07:00:00Z
    expect:
      events: []
      deliveries:
        - {loudness: notify, episode: $problem, to: owner, silent: false}

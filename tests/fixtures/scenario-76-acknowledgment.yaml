id: scenario-76-acknowledgment
start: '2026-09-26T12:00:00Z'
settings:
  settle: 0s
  rejoin_grace: 0s
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
graph:
  - id: device
    checks:
      - id: state
        raise_hold: 0s
        clear_hold: 0s
        ttl: null
        unknown_hold: 15m
title: Acknowledgment survives restart while health and recovery stay observed
covers:
  - scenario-76
policy:
  batch: 0s
  digests: {}
  recipients:
    owner:
      channels:
        - phone
    backup:
      channels:
        - phone
  rules:
    - match: {}
      loudness: notify
      to:
        - owner
        - backup
      remind_every: 5m
      escalate_after: 10m
      require_acknowledgment: true
steps:
  - at: '2026-09-26T12:00:00Z'
    ingest:
      - node: device
        check: state
        status: fail
        reason: availability
    expect:
      events:
        - opened:
            anchor: device
            episode: $problem
      bind:
        problem:
          opened: device
      deliveries:
        - loudness: notify
          episode: $problem
          to: owner
          silent: false
        - loudness: notify
          episode: $problem
          to: backup
          silent: false
  - at: '2026-09-26T12:01:00Z'
    acknowledge:
      episode: $problem
      actor_id: owner
    expect:
      events: []
      deliveries:
        - loudness: notify
          episode: $problem
          to: owner
          silent: true
        - loudness: notify
          episode: $problem
          to: backup
          silent: true
      queries:
        readiness:
          device:
            answer: blocked
            names:
              - device
  - at: '2026-09-26T12:02:00Z'
    acknowledge:
      episode: $problem
      actor_id: backup
    expect:
      events: []
      deliveries: []
  - at: '2026-09-26T12:03:00Z'
    restart: true
    expect:
      events: []
      deliveries: []
  - at: '2026-09-26T12:12:00Z'
    expect:
      events: []
      deliveries: []
      open:
        - episode: $problem
          anchor: device
  - at: '2026-09-26T12:13:00Z'
    ingest:
      - node: device
        check: state
        status: pass
        reason: availability
    expect:
      events:
        - resolved:
            episode: $problem
            resolution: cleared
  - at: '2026-09-26T12:14:00Z'
    ingest:
      - node: device
        check: state
        status: fail
        reason: availability
    expect:
      events:
        - opened:
            anchor: device
            episode: $again
      bind:
        again:
          opened: device
      deliveries:
        - loudness: notify
          episode: $again
          to: owner
          silent: false
        - loudness: notify
          episode: $again
          to: backup
          silent: false

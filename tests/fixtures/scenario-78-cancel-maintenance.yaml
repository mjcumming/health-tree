id: scenario-78-cancel-maintenance
start: '2026-09-26T12:00:00Z'
settings:
  settle: 0s
  rejoin_grace: 0s
  startup_grace: 0s
  coalesce_count: 3
  coalesce_window: 60s
graph:
  - id: device
    checks:
      - id: state
        raise_hold: 0s
        clear_hold: 0s
        ttl: null
        unknown_hold: 15m
title: Canceling one maintenance window retains an overlapping restored window
covers:
  - scenario-78
steps:
  - at: '2026-09-26T12:00:00Z'
    quiet:
      scope: node
      node: device
      until: '2026-09-26T12:20:00Z'
    ingest:
      - node: device
        check: state
        status: fail
        reason: availability
    expect:
      events: []
      open: []
  - at: '2026-09-26T12:01:00Z'
    quiet:
      scope: node
      node: device
      until: '2026-09-26T12:30:00Z'
    expect:
      events: []
  - at: '2026-09-26T12:02:00Z'
    cancel_quiet:
      scope: node
      node: device
      until: '2026-09-26T12:20:00Z'
    expect:
      events: []
      open: []
  - at: '2026-09-26T12:03:00Z'
    restart: true
    expect:
      events: []
  - at: '2026-09-26T12:04:00Z'
    cancel_quiet:
      scope: node
      node: device
      until: '2026-09-26T12:30:00Z'
    expect:
      events:
        - opened:
            anchor: device
            episode: $problem
      bind:
        problem:
          opened: device
      queries:
        readiness:
          device:
            answer: blocked
            names:
              - device
  - at: '2026-09-26T12:05:00Z'
    cancel_quiet:
      scope: node
      node: device
      until: '2026-09-26T12:30:00Z'
    expect:
      events: []
